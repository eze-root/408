name: 网站与试卷

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 检查通过后发布网站（仅 main 分支）
        type: boolean
        default: true

permissions: {}

# PR 的新提交替代旧检查；主分支等待当前发布完成。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 检查与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备日志目录
        run: mkdir -p "$RUNNER_TEMP/408-logs"

      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.8.22'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装 Python 依赖
        run: uv sync --locked

      - name: 检查题目源文件与网站配置
        id: tests
        run: uv run --no-sync python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/408-logs/tests.log"

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: '0.15.1'
          cache-dependency-path: typst/exam-template.typ

      - name: 安装中文与等宽字体
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-dejavu-core

      - name: 生成试卷和网站
        id: site
        run: |
          uv run --no-sync make clean
          uv run --no-sync make dirhtml SPHINXOPTS="-W --keep-going" 2>&1 | tee "$RUNNER_TEMP/408-logs/build.log"

      - name: 检查 PDF 题号、纸张尺寸与页边界
        id: pdfs
        run: uv run --no-sync python scripts/check_papers.py 2>&1 | tee "$RUNNER_TEMP/408-logs/pdfs.log"

      - name: 保存试卷下载包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 408-printable-papers
          path: source/_static/files/papers/*.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 保存待发布网站
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dirhtml
          retention-days: 7

      - name: 保存失败日志
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 408-build-logs
          path: ${{ runner.temp }}/408-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: 写入检查摘要
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          SITE_RESULT: ${{ steps.site.outcome }}
          PDF_RESULT: ${{ steps.pdfs.outcome }}
        run: |
          {
            printf '### 检查结果\n\n'
            printf '| 项目 | 结果 |\n| --- | --- |\n'
            printf '| 源文件与配置 | %s |\n' "$TEST_RESULT"
            printf '| 网站构建 | %s |\n' "$SITE_RESULT"
            printf '| PDF 检查 | %s |\n' "$PDF_RESULT"
            if [[ "$PDF_RESULT" == 'success' ]]; then
              printf '\n'
              tail -n 1 "$RUNNER_TEMP/408-logs/pdfs.log"
              printf '\n试卷下载包保存 14 天，网站构建产物保存 7 天。\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 发布网站
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
